rationale: 'No labelled span creates a duty: the only CUAD labels in the document are Document Name, Agreement Date and thirteen Parties spans, every one of them checked, and they are identifiers and dates
  rather than a permission, a condition or a covenant. The document therefore yields no obligation at all - an empty register, not a register owed by some other party - and the null is a positive claim
  that needs a human, so it escalates E1. The class is clear, not out_of_scope, because guide 1.1.0 §8 places E1 inside clear cases and will not read an escalation off the out_of_scope class.'
