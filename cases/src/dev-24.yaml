rationale: 'Clause A makes the manufacturer liable for the actual amounts its customer must pay its own third-party customers when the customer cannot be supplied - the classic indirect loss. Clause B,
  spliced in from the second source, excludes indirect, special and consequential loss outright ''notwithstanding anything contained in this Agreement to the contrary'', carving out only indemnity, confidentiality
  and breaches of law, none of which covers the clause A duty. The same party must pay the customer''s downstream losses and must have no liability for them; the only route out of the collision would be
  a precedence rule, and neither clause contains one. Constructed pair: verbatim spans, spliced document.'
