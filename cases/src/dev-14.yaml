rationale: 'The duties and the parties are clear on the face of the document, so the case is not ambiguous at class level: the Company must keep the insurances in force at its own cost (47917-48136), the
  Repairer must give notice before its own audit (36541-36652) and must keep the repaired-unit warranty running from Delivery (53349-53701). Every period that fixes when those duties run, however, is replaced
