rationale: 'Clause A makes the manufacturer liable for any actual amounts its customer is contractually required to pay its third-party customers, with no monetary ceiling in the span. Clause B, spliced
  in from the second source, caps total liability under the Agreement at the amounts actually received, ''regardless of the number or type of claims''. Where the downstream exposure exceeds receipts - the
  case the clause A duty exists for - the two cannot both hold, and neither span yields to the other: there is no carve-out and no precedence language. Constructed pair: verbatim spans, spliced document.'
