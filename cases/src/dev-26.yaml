rationale: 'Clause A lists the claims that fall outside the liability cap - third-party claims under the indemnities, gross negligence, fraud, willful misconduct, willful breach, breach of confidentiality,
  and customer liabilities under Section 2.5(e), which is the downstream cash exposure this intake carries - so those amounts are recoverable without a ceiling. Clause B, spliced in from the second source,
  provides that total liability under the Agreement shall not exceed the amounts actually received, ''regardless of the number or type of claims''. Where the downstream exposure exceeds receipts - the case
  the carve-out exists for - the uncapped limb and the total cap cannot both hold, and neither span yields to the other: there is no precedence language and no carve-out in the second clause. The uncapped
  record is mutual, because the cap it excepts restrains both parties (''neither Party''s aggregate liability''). Constructed pair: verbatim spans, spliced document.'
