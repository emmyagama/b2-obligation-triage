rationale: 'Clause A grants the licence as irrevocable and payable up front; clause B, spliced in from the second source, lets either party terminate the Agreement for convenience on written notice, with
  no carve-out preserving the licensed rights. Keeping the grant irrevocable and ending the Agreement at will are not jointly performable: terminating on convenience revokes the licence that the first clause
  says cannot be revoked, and honouring the grant denies the termination right its effect. This is the pattern the guide lists for review, reproduced here by construction: verbatim spans, manufactured collision.
  Per guide §3.3/D3 the irrevocable, perpetual quality is a qualifier on one LIC-GRANT, not a separate obligation, so the record is anchored to the full CUAD `License Grant` span rather than the excluded
  `Irrevocable Or Perpetual License` label.'
