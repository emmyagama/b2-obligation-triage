rationale: 'Clause A elects California law and excludes the CISG for this Agreement and sends disputes to AAA arbitration; clause B, spliced in from the second source, states that the same Agreement and
  the performance of every transaction under it are governed by New York law. Both are exclusive and neither contains precedence language, so no single course of performance satisfies both: the Agreement
  cannot be governed by California and New York at once, and a party pleading one law breaches the other. The pair is a constructed incompatibility - the two spans are verbatim from their own contracts
  and were brought together by the splice, not found in one negotiable instrument.'
