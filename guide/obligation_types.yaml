  decisions_of_record:               # resolved at issue; bound by guide §12
    - {id: D1, topic: rights_as_obligations, resolution: "a right is an obligation only where it implies a duty on the other party; a bare permission yields no obligation and is escalated E1"}
    - {id: D2, topic: liability_caps, resolution: "liability caps and uncapped liability are in scope as risk_allocation types; owed_by for a cap is the restrained party"}
    - {id: D3, topic: licence_qualifiers, resolution: "perpetual/irrevocable/unlimited are folded into LIC-GRANT as grant_qualifiers, never counted as separate obligations"}
    - {id: D4, topic: meaning_of_both, resolution: "both is reserved for indivisible joint duties; drafting that binds each party separately is two obligations, provider and customer"}
    - {id: D5, topic: default_escalations, resolution: "all 14 default escalations stand; review priority LIA-*/TRM-*, then PAY-*/PUR-*, then the rest"}
    - {id: D6, topic: absolute_default, resolution: "no type defaults to absolute; absolute is assigned per instance when a fixed calendar date is stated"}
    - {id: D7, topic: held_out_set, resolution: "test.json (102 contracts) is the sealed held-out set"}
